# Trivy ignore list for the weekly rescan (trivy-rescan.yml, CRITICAL,HIGH,
# ignore-unfixed). Every entry is scoped to a file and expires; when an entry
# expires the scan fails again and the bump must be real.
#
# Since 2026-10-21 ntfy is compiled here from upstream source with the pinned
# GO_VERSION (Dockerfile), so a Go stdlib or x/* finding is fixed by bumping
# GO_VERSION or the upstream version, not by an ignore entry. The three
# go1.27.1 stdlib entries that covered the prebuilt v2.30.0-v2.32.0 binaries
# were dropped with that change.
vulnerabilities: []
